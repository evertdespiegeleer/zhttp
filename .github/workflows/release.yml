name: release

on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: Semver release type
        required: true
        options:
        - patch
        - minor
        - major
  pull_request_target:
    branches:
      - main

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11.10.0

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Git
        uses: fregante/setup-git-user@v1

      - name: Version the packages
        id: version
        run: |
          ./scripts/version.sh ${{ github.event.inputs.release-type }}
          export VERSION=$(cat package.json | jq -r '.version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish to npm
        run: npm publish --workspaces --access=public --provenance
        env:
          NODE_AUTH_TOKEN: ''

      - name: Commit and push changes
        run: |
          git commit -am "chore(version): 📦 ${{ github.event.inputs.release-type }} version bump to ${{ steps.version.outputs.version }}"
          git push

  pr-prerelease:
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: npm-publish
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11.10.0

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Configure Git
        uses: fregante/setup-git-user@v1

      - name: Version the packages
        id: version
        run: |
          ./scripts/version.sh prerelease --preid $(echo "${{ steps.extract_branch.outputs.branch }}" | tr -cs 'a-zA-Z0-9-' '-' | sed 's/-$//')
          export VERSION=$(cat package.json | jq -r '.version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish to npm
        run: npm publish --workspaces --access=public --provenance --tag prerelease
        env:
          NODE_AUTH_TOKEN: ''

      - name: Commit and push changes
        run: |
          git commit -am "chore(version): 📦 prerelease version bump to ${{ steps.version.outputs.version }}"
          git push
